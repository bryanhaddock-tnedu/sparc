name: Docker Build and Push
on:
  push:
    branches: [ '*' ]
    tags: [ '*' ]
jobs:
  build:
    name: Docker Image Build
    runs-on: ubuntu-24.04
    if: ${{ github.actor != 'dependabot[bot]' }}
    env:
      STAGE_DEPLOY_HOOK_URL: ${{ secrets.STAGE_DEPLOY_HOOK_URL }}
      STAGE_APP_URL: https://sparc.uat.tnedu.gov
    steps:
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v4.0.0
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_SECRET }}
      - name: Docker Build and Push
        uses: docker/build-push-action@v7.0.0
        with:
          target: app
          push: true
          build-args: |
            VITE_BUILD_VERSION=${{ github.sha }}
          tags: |
            ${{ secrets.REGISTRY_URL }}/sparc:${{ github.sha }}
            ${{ secrets.REGISTRY_URL }}/sparc:latest
      - name: Trigger Stage Deploy Hook
        if: ${{ github.ref == 'refs/heads/develop' }}
        run: |
          if [ -z "$STAGE_DEPLOY_HOOK_URL" ]; then
            echo "::error::STAGE_DEPLOY_HOOK_URL is not configured, so the stage image was built but UAT was not rolled."
            exit 1
          fi
          curl -fsS -X POST "$STAGE_DEPLOY_HOOK_URL"
      - name: Verify Stage Deployment
        if: ${{ github.ref == 'refs/heads/develop' }}
        run: |
          echo "Waiting for $STAGE_APP_URL to report build $GITHUB_SHA"
          for attempt in $(seq 1 30); do
            response="$(curl -fsS "$STAGE_APP_URL/api/app-version" || true)"
            version="$(RESPONSE="$response" python3 -c 'import json, os; print(json.loads(os.environ["RESPONSE"]).get("version", ""))' 2>/dev/null || true)"
            echo "Attempt $attempt/30: reported '${version:-unavailable}'"
            if [ "$version" = "$GITHUB_SHA" ]; then
              echo "Stage is running $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Stage deploy did not reach $GITHUB_SHA. Last response: $response"
          exit 1
