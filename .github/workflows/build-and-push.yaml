name: Docker Build and Push
on:
  push:
    branches: [ '*' ]
    tags: [ '*' ]
jobs:
  build:
    name: Docker Image Build
    runs-on: ubuntu-24.04
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v4.0.0
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_SECRET }}
      - name: Docker Build and Push
        uses: docker/build-push-action@v7.0.0
        with:
          target: app
          push: true
          build-args: |
            VITE_BUILD_VERSION=${{ github.sha }}
          tags: |
            ${{ secrets.REGISTRY_URL }}/sparc:${{ github.sha }}
            ${{ secrets.REGISTRY_URL }}/sparc:latest
      - name: Report UAT Version
        if: ${{ github.ref == 'refs/heads/develop' }}
        continue-on-error: true
        run: |
          stage_url="https://sparc.uat.tnedu.gov"
          response="$(curl -fsS "$stage_url/api/app-version" || true)"
          version="$(RESPONSE="$response" python3 -c 'import json, os; print(json.loads(os.environ["RESPONSE"]).get("version", ""))' 2>/dev/null || true)"
          {
            echo "## UAT version snapshot"
            echo "- Image pushed: \`$GITHUB_SHA\`"
            echo "- UAT reported version: \`${version:-unavailable}\`"
            echo "- UAT response: \`$response\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$version" != "$GITHUB_SHA" ]; then
            echo "::warning::Image push succeeded, but UAT is currently reporting '${version:-unavailable}'. The rollout may be pending or handled by an external deployment process."
          fi
